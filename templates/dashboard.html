<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Approval Tracker</title>
    <link rel="stylesheet" href="/static/style.css?v={{ cache_bust }}">
</head>
<body>
    <div id="error-banner" class="error-banner" style="display: none;">
        <span id="error-banner-text"></span>
        <button class="error-banner-close" onclick="dismissErrorBanner()" title="Dismiss">&times;</button>
    </div>
    <header>
        <div class="header-left">
            <h1>Program Dashboard</h1>
        </div>
        <div class="header-middle">
            <div class="view-toggle">
                <button class="toggle-btn active" onclick="switchView('programs')" id="btn-programs">CIM Programs</button>
                <button class="toggle-btn" onclick="switchView('courses')" id="btn-courses">CIM Courses</button>
                <button class="toggle-btn" onclick="switchView('catalog')" id="btn-catalog">CIM Catalog</button>
                <button class="toggle-btn" onclick="switchView('portfolio')" id="btn-portfolio">Portfolio</button>
            </div>
            <div class="header-search">
                <input type="text" id="filter-search" placeholder="Search programs by name or banner code..." oninput="applyFilters(); updateClearButtons()">
                <span class="filter-clear header-search-clear" onclick="clearFilter('filter-search')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="header-right">
            <span id="last-updated" class="last-updated"></span>
            <span id="scan-status" class="scan-status"></span>
            <div id="progress-container" class="progress-container" style="display: none;">
                <span id="progress-phase" class="progress-phase"></span>
            </div>
            <button id="scan-btn" onclick="triggerScan()">Update Now</button>
        </div>
    </header>

    <div class="subtle-links">
        <a href="#" id="refs-btn" onclick="openReferencesModal(); return false;" title="Manage custom reference curricula">Manage custom references</a>
    </div>

    <!-- Manage References modal (local-only) -->
    <div id="refs-modal" class="modal-overlay" style="display: none;" onclick="closeReferencesModalIfBackdrop(event)">
        <div class="modal-panel" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2>Custom Reference Curricula</h2>
                <button class="modal-close" onclick="closeReferencesModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="refs-upload">
                    <h3>Upload a new reference</h3>
                    <p class="refs-help">Supported: <code>.docx</code>, <code>.pdf</code>. Legacy <code>.doc</code> must be re-saved as <code>.docx</code> first.</p>
                    <form id="ref-upload-form" onsubmit="return uploadCustomReference(event)">
                        <label>File: <input type="file" id="ref-upload-file" accept=".docx,.pdf" required></label>
                        <label>Display name (optional): <input type="text" id="ref-upload-name" placeholder="auto-detected from document"></label>
                        <label>Notes (optional): <input type="text" id="ref-upload-notes"></label>
                        <button type="submit" id="ref-upload-submit">Upload &amp; parse</button>
                        <span id="ref-upload-status"></span>
                    </form>
                </div>
                <hr>
                <div class="refs-list-wrap">
                    <h3>Saved references</h3>
                    <div id="refs-list">
                        <p class="empty-state">Loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Portfolio filter bar (visible only in portfolio view) -->
    <section id="portfolio-filters" class="portfolio-filters-section" style="display:none">
        <div style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center">
            <button class="portfolio-lvl-btn" data-lvl="Undergraduate" onclick="setPortfolioLevel(this,'Undergraduate')">Undergraduate</button>
            <button class="portfolio-lvl-btn" data-lvl="Graduate" onclick="setPortfolioLevel(this,'Graduate')">Graduate</button>
        </div>
        <div style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center">
            <button class="portfolio-deg-btn" data-deg="Bachelor's" onclick="setPortfolioDegree(this,&quot;Bachelor's&quot;)">Bachelor's</button>
            <button class="portfolio-deg-btn" data-deg="Master's" onclick="setPortfolioDegree(this,&quot;Master's&quot;)">Master's</button>
            <button class="portfolio-deg-btn" data-deg="Doctorate" onclick="setPortfolioDegree(this,'Doctorate')">Doctorate</button>
            <button class="portfolio-deg-btn" data-deg="Certificate" onclick="setPortfolioDegree(this,'Certificate')">Certificate</button>
            <button class="portfolio-deg-btn" data-deg="Minor" onclick="setPortfolioDegree(this,'Minor')">Minor</button>
            <button class="portfolio-deg-btn" data-deg="Dual Degree" onclick="setPortfolioDegree(this,'Dual Degree')">Dual Degree</button>
        </div>
        <div class="filter-group" style="flex-basis:100%; margin:0; padding:4px 0 0"></div>
        <div class="filter-group">
            <label>College:</label>
            <div class="filter-multi-wrap" id="fmw-portfolio-filter-college">
                <button class="filter-multi-btn" id="portfolio-filter-college" onclick="togglePortfolioMultiFilter('portfolio-filter-college', event)">— select — ▾</button>
                <div class="filter-multi-dropdown" id="fmd-portfolio-filter-college"></div>
                <span class="filter-clear" onclick="clearPortfolioFilter('portfolio-filter-college')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>Campus:</label>
            <div class="filter-multi-wrap" id="fmw-portfolio-filter-campus">
                <button class="filter-multi-btn" id="portfolio-filter-campus" onclick="togglePortfolioMultiFilter('portfolio-filter-campus', event)">— select — ▾</button>
                <div class="filter-multi-dropdown" id="fmd-portfolio-filter-campus"></div>
                <span class="filter-clear" onclick="clearPortfolioFilter('portfolio-filter-campus')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <div class="filter-select-wrap">
                <input type="text" id="portfolio-search" placeholder="Search programs…"
                       oninput="portfolioSearch=this.value; updateClearButtons(); renderPortfolioTable()" style="width:200px">
                <span class="filter-clear" onclick="portfolioSearch=''; document.getElementById('portfolio-search').value=''; updateClearButtons(); renderPortfolioTable()" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group" style="flex-basis:100%; margin:0; padding:0"></div>
        <div class="filter-group">
            <label>SVT Status:</label>
            <div class="filter-multi-wrap" id="fmw-portfolio-filter-roster">
                <button class="filter-multi-btn" id="portfolio-filter-roster" onclick="togglePortfolioMultiFilter('portfolio-filter-roster', event)">— select — ▾</button>
                <div class="filter-multi-dropdown" id="fmd-portfolio-filter-roster"></div>
                <span class="filter-clear" onclick="clearPortfolioFilter('portfolio-filter-roster')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>GLS Status:</label>
            <div class="filter-multi-wrap" id="fmw-portfolio-filter-gls">
                <button class="filter-multi-btn" id="portfolio-filter-gls" onclick="togglePortfolioMultiFilter('portfolio-filter-gls', event)">— select — ▾</button>
                <div class="filter-multi-dropdown" id="fmd-portfolio-filter-gls"></div>
                <span class="filter-clear" onclick="clearPortfolioFilter('portfolio-filter-gls')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>IPD Status:</label>
            <div class="filter-multi-wrap" id="fmw-portfolio-filter-ipd">
                <button class="filter-multi-btn" id="portfolio-filter-ipd" onclick="togglePortfolioMultiFilter('portfolio-filter-ipd', event)">— select — ▾</button>
                <div class="filter-multi-dropdown" id="fmd-portfolio-filter-ipd"></div>
                <span class="filter-clear" onclick="clearPortfolioFilter('portfolio-filter-ipd')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>OTP Status:</label>
            <div class="filter-multi-wrap" id="fmw-portfolio-filter-otp">
                <button class="filter-multi-btn" id="portfolio-filter-otp" onclick="togglePortfolioMultiFilter('portfolio-filter-otp', event)">— select — ▾</button>
                <div class="filter-multi-dropdown" id="fmd-portfolio-filter-otp"></div>
                <span class="filter-clear" onclick="clearPortfolioFilter('portfolio-filter-otp')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>CIM Step:</label>
            <div class="filter-multi-wrap" id="fmw-portfolio-filter-cim">
                <button class="filter-multi-btn" id="portfolio-filter-cim" onclick="togglePortfolioMultiFilter('portfolio-filter-cim', event)">— select — ▾</button>
                <div class="filter-multi-dropdown" id="fmd-portfolio-filter-cim"></div>
                <span class="filter-clear" onclick="clearPortfolioFilter('portfolio-filter-cim')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>CIM Change:</label>
            <div class="filter-multi-wrap" id="fmw-portfolio-filter-cimchange">
                <button class="filter-multi-btn" id="portfolio-filter-cimchange" onclick="togglePortfolioMultiFilter('portfolio-filter-cimchange', event)">— select — ▾</button>
                <div class="filter-multi-dropdown" id="fmd-portfolio-filter-cimchange"></div>
                <span class="filter-clear" onclick="clearPortfolioFilter('portfolio-filter-cimchange')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>In Workflow:</label>
            <div class="filter-multi-wrap" id="fmw-portfolio-filter-inworkflow">
                <button class="filter-multi-btn" id="portfolio-filter-inworkflow" onclick="togglePortfolioMultiFilter('portfolio-filter-inworkflow', event)">— select — ▾</button>
                <div class="filter-multi-dropdown" id="fmd-portfolio-filter-inworkflow"></div>
                <span class="filter-clear" onclick="clearPortfolioFilter('portfolio-filter-inworkflow')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>Inact. of Admission:</label>
            <div class="filter-multi-wrap" id="fmw-portfolio-filter-inactadmit">
                <button class="filter-multi-btn" id="portfolio-filter-inactadmit" onclick="togglePortfolioMultiFilter('portfolio-filter-inactadmit', event)">— select — ▾</button>
                <div class="filter-multi-dropdown" id="fmd-portfolio-filter-inactadmit"></div>
                <span class="filter-clear" onclick="clearPortfolioFilter('portfolio-filter-inactadmit')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>Admitting Today:</label>
            <div class="filter-select-wrap">
                <select id="portfolio-filter-inacttoday" onchange="portfolioInactTodayFilter=this.value; updateClearButtons(); renderPortfolioTable()"></select>
                <span class="filter-clear" onclick="clearPortfolioFilter('portfolio-filter-inacttoday')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <div class="portfolio-col-picker" id="portfolio-col-picker">
                <button class="portfolio-col-picker-btn" onclick="togglePortfolioColPicker(event)">Columns ▾</button>
                <div class="portfolio-col-dropdown" id="portfolio-col-dropdown"></div>
            </div>
        </div>
        <div class="filter-group">
            <span id="portfolio-result-count" class="result-count"></span>
        </div>
    </section>

    <!-- Pipeline Summary -->
    <section id="pipeline" class="pipeline-section">
        <h2>Pipeline Summary</h2>
        <div id="pipeline-bar" class="pipeline-bar">
            <!-- Populated by JS -->
        </div>
    </section>

    <!-- Smart Views + Type Buttons -->
    <section class="smart-views-section">
        <div class="view-group">
            <button class="type-btn" onclick="setTypeFilter('Undergraduate')">Undergraduate</button>
            <button class="type-btn" onclick="setTypeFilter('Graduate')">Graduate</button>
            <button class="type-btn" id="btn-type-continuing" onclick="setTypeFilter('Continuing')">Continuing</button>
        </div>
        <div class="view-divider"></div>
        <div class="view-group">
            <button class="proposal-btn" id="btn-proposal-new" onclick="setProposalFilter('Added')">New Programs</button>
            <button class="proposal-btn" onclick="setProposalFilter('Edited')">Changes</button>
            <button class="proposal-btn" onclick="setProposalFilter('Deactivated')">Inactivations</button>
            <button class="proposal-btn" id="btn-proposal-complete" onclick="togglePipelineFilter('__complete__')">Complete</button>
        </div>
    </section>

    <!-- Program-kind filter (programs view only) -->
    <section class="kind-filter-section" id="kind-filter-row">
        <button class="kind-btn" data-kind="bachelors" onclick="setProgramKindFilter('bachelors')">Bachelor's</button>
        <button class="kind-btn" data-kind="masters" onclick="setProgramKindFilter('masters')">Master's</button>
        <button class="kind-btn" data-kind="doctorate" onclick="setProgramKindFilter('doctorate')">Doctorate</button>
        <button class="kind-btn" data-kind="certificate" onclick="setProgramKindFilter('certificate')">Certificate</button>
        <button class="kind-btn" data-kind="minor" onclick="setProgramKindFilter('minor')">Minor</button>
        <button class="kind-btn" data-kind="plusone" onclick="setProgramKindFilter('plusone')">PlusOne</button>
        <button class="kind-btn" data-kind="concentration" onclick="setProgramKindFilter('concentration')">Concentration</button>
        <button class="kind-btn" data-kind="dual" onclick="setProgramKindFilter('dual')">Dual Degree</button>
    </section>

    <!-- Smart Views: New Submissions → Recent Changes → Potentially Stuck -->
    <section class="smart-actions-section">
        <button class="smart-view-btn" onclick="setSmartView('new')">New Submissions</button>
        <button class="smart-view-btn" onclick="setSmartView('recent')">Recent Changes</button>
        <button class="smart-view-btn" onclick="setSmartView('stuck')">Potentially Stuck</button>
    </section>

    <!-- Filters -->
    <section class="filters-section">
        <div class="filter-group">
            <label>College:</label>
            <div class="filter-select-wrap">
                <select id="filter-college" onchange="applyFilters(); updateClearButtons()">
                    <option value="">All Colleges</option>
                </select>
                <span class="filter-clear" onclick="clearFilter('filter-college')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group" id="filter-group-subject" style="display: none">
            <label>Subject Code:</label>
            <div class="filter-select-wrap">
                <select id="filter-subject" onchange="applyFilters(); updateClearButtons()">
                    <option value="">All Subjects</option>
                </select>
                <span class="filter-clear" onclick="clearFilter('filter-subject')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>Campus:</label>
            <div class="filter-select-wrap">
                <select id="filter-campus" onchange="applyFilters(); updateClearButtons()">
                    <option value="">All Campuses</option>
                </select>
                <span class="filter-clear" onclick="clearFilter('filter-campus')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>Approver:</label>
            <div class="filter-select-wrap">
                <select id="filter-approver" onchange="applyFilters(); updateClearButtons()">
                    <option value="">All Approvers</option>
                </select>
                <span class="filter-clear" onclick="clearFilter('filter-approver')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <label>Step:</label>
            <div class="filter-select-wrap">
                <select id="filter-step" onchange="applyFilters(); updateClearButtons()">
                    <option value="">All Steps</option>
                </select>
                <span class="filter-clear" onclick="clearFilter('filter-step')" title="Clear">&times;</span>
            </div>
        </div>
        <div class="filter-group">
            <span id="result-count" class="result-count"></span>
        </div>
    </section>

    <!-- Programs Table -->
    <section id="programs" class="programs-section">
        <div id="programs-table-container">
            <!-- Populated by JS -->
        </div>
    </section>


    <script src="/static/app.js?v={{ cache_bust }}"></script>
</body>
</html>
