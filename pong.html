<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong — Maximum AI</title>
<style>
  :root { --fg: #e8f0ff; --accent: #4ade80; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #05070d;
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    user-select: none;
  }
  h1 { font-weight: 600; letter-spacing: 2px; font-size: 22px; }
  #wrap { position: relative; }
  canvas {
    background: #0a0e1a;
    border: 1px solid #1c2640;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(74, 222, 128, 0.08);
    display: block;
  }
  #hud {
    display: flex;
    gap: 24px;
    align-items: center;
    font-size: 13px;
    color: #8aa0c8;
  }
  #hud label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  select, button {
    background: #121a2e;
    color: var(--fg);
    border: 1px solid #283556;
    border-radius: 4px;
    padding: 4px 8px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  #msg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-size: 14px;
    color: #8aa0c8;
    pointer-events: none;
    line-height: 1.6;
  }
  kbd {
    background: #1c2640; border-radius: 3px; padding: 1px 5px;
    font-size: 11px; border: 1px solid #283556;
  }
</style>
</head>
<body>
  <h1>P O N G</h1>
  <div id="wrap">
    <canvas id="game" width="800" height="500"></canvas>
    <div id="msg">Move your mouse (or <kbd>↑</kbd>/<kbd>↓</kbd>) over the board<br>Click or press <kbd>Space</kbd> to serve</div>
  </div>
  <div id="hud">
    <label>AI strength:
      <select id="difficulty">
        <option value="perfect" selected>Perfect (unbeatable)</option>
        <option value="hard">Hard</option>
        <option value="fair">Fair</option>
      </select>
    </label>
    <span>You: <b id="you">0</b> &nbsp;·&nbsp; AI: <b id="ai">0</b></span>
    <button id="reset">Reset</button>
  </div>

<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const PADDLE_W = 12, PADDLE_H = 90;
const BALL_R = 8;
const PADDLE_X_MARGIN = 24;

const state = {
  player: { y: H/2 - PADDLE_H/2, x: W - PADDLE_X_MARGIN - PADDLE_W },
  ai:     { y: H/2 - PADDLE_H/2, x: PADDLE_X_MARGIN },
  ball:   { x: W/2, y: H/2, vx: 0, vy: 0, speed: 6 },
  scores: { you: 0, ai: 0 },
  running: false,
  serveTo: 1, // +1 toward player (right), -1 toward AI (left)
  difficulty: 'perfect',
};

// AI tuning per difficulty. The "perfect" AI computes the ball's exact
// landing point by simulating wall bounces, then moves with effectively
// unlimited speed — so it is mathematically unbeatable.
const AI_CFG = {
  perfect: { maxSpeed: Infinity, react: 1.0,  predict: true,  jitter: 0   },
  hard:    { maxSpeed: 8.5,      react: 0.92, predict: true,  jitter: 10  },
  fair:    { maxSpeed: 5.0,      react: 0.75, predict: false, jitter: 38  },
};

function serve(dir) {
  state.ball.x = W/2;
  state.ball.y = H/2;
  state.ball.speed = 6;
  // Launch at a moderate angle in the chosen horizontal direction.
  const angle = (Math.random() * 0.6 - 0.3); // -0.3..0.3 rad
  state.ball.vx = dir * state.ball.speed * Math.cos(angle);
  state.ball.vy = state.ball.speed * Math.sin(angle);
  state.running = true;
  hideMsg();
}

// Predict the y-coordinate at which the ball will cross a target x,
// accounting for top/bottom wall reflections. Returns null if the ball
// is moving away from the target.
function predictY(ball, targetX) {
  if ((targetX < ball.x && ball.vx >= 0) || (targetX > ball.x && ball.vx <= 0)) {
    return null;
  }
  const dx = targetX - ball.x;
  const t = dx / ball.vx;
  let y = ball.y + ball.vy * t;
  // Reflect into [BALL_R, H - BALL_R] using the triangle-wave fold.
  const span = H - 2 * BALL_R;
  let m = (y - BALL_R) % (2 * span);
  if (m < 0) m += 2 * span;
  if (m > span) m = 2 * span - m;
  return BALL_R + m;
}

function updateAI() {
  const cfg = AI_CFG[state.difficulty];
  const ai = state.ai;
  const center = ai.y + PADDLE_H / 2;
  let target;

  if (cfg.predict && state.ball.vx < 0) {
    const py = predictY(state.ball, ai.x + PADDLE_W);
    target = py == null ? H/2 : py;
  } else if (state.ball.vx < 0) {
    target = state.ball.y; // naive follow
  } else {
    // Ball moving away — drift back toward center, like a real player.
    target = H/2;
  }

  if (cfg.jitter) target += (Math.random() * 2 - 1) * cfg.jitter;

  const desired = target - PADDLE_H / 2;
  const delta = (desired - ai.y) * cfg.react;
  const step = Math.max(-cfg.maxSpeed, Math.min(cfg.maxSpeed, delta));
  ai.y += step;
  ai.y = Math.max(0, Math.min(H - PADDLE_H, ai.y));
}

function reflectOffPaddle(ball, paddle, dir) {
  // dir = +1 if ball should now travel right, -1 left.
  const rel = (ball.y - (paddle.y + PADDLE_H/2)) / (PADDLE_H/2); // -1..1
  const bounceAngle = rel * (Math.PI * 0.42); // up to ~75°
  ball.speed = Math.min(ball.speed * 1.05, 16); // speed up each hit
  ball.vx = dir * ball.speed * Math.cos(bounceAngle);
  ball.vy = ball.speed * Math.sin(bounceAngle);
}

function update() {
  if (state.running) {
    const b = state.ball;
    b.x += b.vx;
    b.y += b.vy;

    // Top / bottom walls.
    if (b.y - BALL_R < 0)      { b.y = BALL_R; b.vy = Math.abs(b.vy); }
    if (b.y + BALL_R > H)      { b.y = H - BALL_R; b.vy = -Math.abs(b.vy); }

    // AI paddle (left).
    const ai = state.ai;
    if (b.x - BALL_R <= ai.x + PADDLE_W && b.x - BALL_R >= ai.x &&
        b.y >= ai.y && b.y <= ai.y + PADDLE_H && b.vx < 0) {
      b.x = ai.x + PADDLE_W + BALL_R;
      reflectOffPaddle(b, ai, +1);
    }

    // Player paddle (right).
    const p = state.player;
    if (b.x + BALL_R >= p.x && b.x + BALL_R <= p.x + PADDLE_W &&
        b.y >= p.y && b.y <= p.y + PADDLE_H && b.vx > 0) {
      b.x = p.x - BALL_R;
      reflectOffPaddle(b, p, -1);
    }

    // Scoring.
    if (b.x + BALL_R < 0) {        // past AI's side — player scores
      state.scores.you++;
      endPoint(+1);
    } else if (b.x - BALL_R > W) { // past player's side — AI scores
      state.scores.ai++;
      endPoint(-1);
    }

    updateAI();
  }
}

function endPoint(nextServeDir) {
  state.running = false;
  state.serveTo = nextServeDir;
  document.getElementById('you').textContent = state.scores.you;
  document.getElementById('ai').textContent = state.scores.ai;
  showMsg(nextServeDir === 1
    ? 'Point! Click or press Space to serve toward you'
    : 'AI scores. Click or press Space to serve');
  state.ball.x = W/2; state.ball.y = H/2; state.ball.vx = 0; state.ball.vy = 0;
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Center dashed line.
  ctx.strokeStyle = '#1c2640';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 12]);
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);

  // Paddles.
  ctx.fillStyle = '#4ade80'; // AI
  rrect(state.ai.x, state.ai.y, PADDLE_W, PADDLE_H);
  ctx.fillStyle = '#e8f0ff'; // player
  rrect(state.player.x, state.player.y, PADDLE_W, PADDLE_H);

  // Ball.
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  ctx.arc(state.ball.x, state.ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
}

function rrect(x, y, w, h) {
  const r = 4;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.fill();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// ---- Input ----
function setPlayerY(y) {
  state.player.y = Math.max(0, Math.min(H - PADDLE_H, y - PADDLE_H/2));
}
cv.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  setPlayerY((e.clientY - rect.top) * (H / rect.height));
});
const keys = {};
window.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); if (!state.running) serve(state.serveTo); }
  if (e.key === 'ArrowUp')   keys.up = true;
  if (e.key === 'ArrowDown') keys.down = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp')   keys.up = false;
  if (e.key === 'ArrowDown') keys.down = false;
});
setInterval(() => { // keyboard paddle movement
  if (keys.up)   setPlayerY(state.player.y + PADDLE_H/2 - 12);
  if (keys.down) setPlayerY(state.player.y + PADDLE_H/2 + 12);
}, 16);

cv.addEventListener('click', () => { if (!state.running) serve(state.serveTo); });

document.getElementById('difficulty').addEventListener('change', e => {
  state.difficulty = e.target.value;
});
document.getElementById('reset').addEventListener('click', () => {
  state.scores.you = 0; state.scores.ai = 0;
  document.getElementById('you').textContent = 0;
  document.getElementById('ai').textContent = 0;
  endPoint(1);
  showMsg('Click or press Space to serve');
});

const msgEl = document.getElementById('msg');
function showMsg(t) { msgEl.innerHTML = t; msgEl.style.display = 'block'; }
function hideMsg() { msgEl.style.display = 'none'; }

loop();
</script>
</body>
</html>
