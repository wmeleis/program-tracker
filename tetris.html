<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --grid: #21262d;
    --text: #e6edf3;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
  }
  .game {
    display: flex;
    gap: 24px;
    padding: 24px;
    align-items: flex-start;
  }
  canvas {
    background: var(--panel);
    border: 2px solid var(--grid);
    border-radius: 8px;
    display: block;
  }
  .side {
    width: 160px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .box {
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 8px;
    padding: 14px;
  }
  .box .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8b949e;
    margin-bottom: 6px;
  }
  .box .value {
    font-size: 26px;
    font-weight: 700;
  }
  #next {
    background: transparent;
    border: none;
    margin: 0 auto;
    display: block;
  }
  .controls {
    font-size: 12px;
    line-height: 1.9;
    color: #8b949e;
  }
  .controls b { color: var(--text); }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(13,17,23,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 36px; color: var(--accent); }
  .overlay p { color: #8b949e; }
  .overlay button {
    margin-top: 8px;
    padding: 10px 24px;
    font-size: 16px;
    background: var(--accent);
    color: #0d1117;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="game">
    <canvas id="board" width="300" height="600"></canvas>
    <div class="side">
      <h1>TETRIS</h1>
      <div class="box">
        <div class="label">Score</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="box">
        <div class="label">Lines</div>
        <div class="value" id="lines">0</div>
      </div>
      <div class="box">
        <div class="label">Level</div>
        <div class="value" id="level">1</div>
      </div>
      <div class="box">
        <div class="label">Next</div>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
      <div class="controls">
        <b>←  →</b> Move<br>
        <b>↑</b> Rotate<br>
        <b>↓</b> Soft drop<br>
        <b>Space</b> Hard drop<br>
        <b>P</b> Pause
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <h2 id="overlay-title">Game Over</h2>
    <p id="overlay-text">Press the button to play again</p>
    <button id="restart">New Game</button>
  </div>

<script>
const COLS = 10, ROWS = 20, CELL = 30;
const board = document.getElementById('board');
const ctx = board.getContext('2d');
const nextCanvas = document.getElementById('next');
const nctx = nextCanvas.getContext('2d');

const scoreEl = document.getElementById('score');
const linesEl = document.getElementById('lines');
const levelEl = document.getElementById('level');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayText = document.getElementById('overlay-text');

// Tetromino shapes (each rotation state derived by rotating matrix)
const SHAPES = {
  I: { color: '#2dd4bf', cells: [[0,1],[1,1],[2,1],[3,1]], size: 4 },
  O: { color: '#facc15', cells: [[1,0],[2,0],[1,1],[2,1]], size: 4 },
  T: { color: '#c084fc', cells: [[1,0],[0,1],[1,1],[2,1]], size: 3 },
  S: { color: '#4ade80', cells: [[1,0],[2,0],[0,1],[1,1]], size: 3 },
  Z: { color: '#f87171', cells: [[0,0],[1,0],[1,1],[2,1]], size: 3 },
  J: { color: '#60a5fa', cells: [[0,0],[0,1],[1,1],[2,1]], size: 3 },
  L: { color: '#fb923c', cells: [[2,0],[0,1],[1,1],[2,1]], size: 3 },
};
const TYPES = Object.keys(SHAPES);

let grid, current, nextPiece, score, lines, level, dropInterval, dropTimer, gameOver, paused, rafId;

function emptyGrid() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(null));
}

function makePiece(type) {
  const s = SHAPES[type];
  // build a size x size matrix
  const m = Array.from({length: s.size}, () => Array(s.size).fill(0));
  s.cells.forEach(([x,y]) => m[y][x] = 1);
  return {
    type,
    color: s.color,
    matrix: m,
    x: Math.floor((COLS - s.size) / 2),
    y: -topOffset(m),
  };
}

function topOffset(m) {
  for (let y = 0; y < m.length; y++) {
    if (m[y].some(v => v)) return y;
  }
  return 0;
}

function randomType() {
  return TYPES[Math.floor(Math.random() * TYPES.length)];
}

function rotate(matrix) {
  const n = matrix.length;
  const res = Array.from({length: n}, () => Array(n).fill(0));
  for (let y = 0; y < n; y++)
    for (let x = 0; x < n; x++)
      res[x][n - 1 - y] = matrix[y][x];
  return res;
}

function collides(piece, offX, offY, matrix) {
  const m = matrix || piece.matrix;
  for (let y = 0; y < m.length; y++) {
    for (let x = 0; x < m[y].length; x++) {
      if (!m[y][x]) continue;
      const nx = piece.x + x + offX;
      const ny = piece.y + y + offY;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && grid[ny][nx]) return true;
    }
  }
  return false;
}

function merge(piece) {
  piece.matrix.forEach((row, y) => {
    row.forEach((v, x) => {
      if (v) {
        const ny = piece.y + y;
        const nx = piece.x + x;
        if (ny >= 0) grid[ny][nx] = piece.color;
      }
    });
  });
}

function clearLines() {
  let cleared = 0;
  for (let y = ROWS - 1; y >= 0; y--) {
    if (grid[y].every(c => c)) {
      grid.splice(y, 1);
      grid.unshift(Array(COLS).fill(null));
      cleared++;
      y++; // recheck same row index
    }
  }
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800][cleared] * level;
    score += points;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(80, 800 - (level - 1) * 70);
    updateStats();
  }
}

function updateStats() {
  scoreEl.textContent = score;
  linesEl.textContent = lines;
  levelEl.textContent = level;
}

function spawn() {
  current = nextPiece;
  nextPiece = makePiece(randomType());
  drawNext();
  if (collides(current, 0, 0)) {
    endGame();
  }
}

function lockAndNext() {
  merge(current);
  clearLines();
  spawn();
}

function softDrop() {
  if (collides(current, 0, 1)) {
    lockAndNext();
  } else {
    current.y++;
  }
}

function hardDrop() {
  let dist = 0;
  while (!collides(current, 0, dist + 1)) dist++;
  current.y += dist;
  score += dist * 2;
  updateStats();
  lockAndNext();
}

function move(dir) {
  if (!collides(current, dir, 0)) current.x += dir;
}

function tryRotate() {
  const rotated = rotate(current.matrix);
  // wall kicks
  for (const kick of [0, -1, 1, -2, 2]) {
    if (!collides(current, kick, 0, rotated)) {
      current.matrix = rotated;
      current.x += kick;
      return;
    }
  }
}

function drawCell(c, x, y, color, size = CELL) {
  c.fillStyle = color;
  c.fillRect(x * size, y * size, size, size);
  c.fillStyle = 'rgba(255,255,255,0.18)';
  c.fillRect(x * size, y * size, size, 4);
  c.fillStyle = 'rgba(0,0,0,0.25)';
  c.fillRect(x * size, y * size + size - 4, size, 4);
  c.strokeStyle = 'rgba(0,0,0,0.35)';
  c.lineWidth = 1;
  c.strokeRect(x * size + 0.5, y * size + 0.5, size - 1, size - 1);
}

function drawGridLines() {
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL, 0);
    ctx.lineTo(x * CELL, ROWS * CELL);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL);
    ctx.lineTo(COLS * CELL, y * CELL);
    ctx.stroke();
  }
}

function ghostY() {
  let dist = 0;
  while (!collides(current, 0, dist + 1)) dist++;
  return current.y + dist;
}

function draw() {
  ctx.clearRect(0, 0, board.width, board.height);
  drawGridLines();

  // settled blocks
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (grid[y][x]) drawCell(ctx, x, y, grid[y][x]);

  // ghost piece
  const gy = ghostY();
  current.matrix.forEach((row, y) => {
    row.forEach((v, x) => {
      if (v) {
        const py = gy + y;
        if (py >= 0) {
          ctx.fillStyle = current.color;
          ctx.globalAlpha = 0.18;
          ctx.fillRect((current.x + x) * CELL, py * CELL, CELL, CELL);
          ctx.globalAlpha = 1;
        }
      }
    });
  });

  // current piece
  current.matrix.forEach((row, y) => {
    row.forEach((v, x) => {
      if (v) {
        const py = current.y + y;
        if (py >= 0) drawCell(ctx, current.x + x, py, current.color);
      }
    });
  });
}

function drawNext() {
  nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  const s = SHAPES[nextPiece.type];
  const size = 24;
  // compute bounds for centering
  const m = nextPiece.matrix;
  let minX = 99, maxX = -1, minY = 99, maxY = -1;
  m.forEach((row, y) => row.forEach((v, x) => {
    if (v) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  }));
  const w = (maxX - minX + 1) * size;
  const h = (maxY - minY + 1) * size;
  const ox = (nextCanvas.width - w) / 2;
  const oy = (nextCanvas.height - h) / 2;
  m.forEach((row, y) => row.forEach((v, x) => {
    if (v) {
      const px = ox + (x - minX) * size;
      const py = oy + (y - minY) * size;
      nctx.fillStyle = nextPiece.color;
      nctx.fillRect(px, py, size, size);
      nctx.fillStyle = 'rgba(255,255,255,0.18)';
      nctx.fillRect(px, py, size, 4);
      nctx.fillStyle = 'rgba(0,0,0,0.25)';
      nctx.fillRect(px, py + size - 4, size, 4);
      nctx.strokeStyle = 'rgba(0,0,0,0.35)';
      nctx.strokeRect(px + 0.5, py + 0.5, size - 1, size - 1);
    }
  }));
}

let lastTime = 0;
function loop(time = 0) {
  if (gameOver || paused) return;
  const delta = time - lastTime;
  dropTimer += delta;
  lastTime = time;
  if (dropTimer >= dropInterval) {
    softDrop();
    dropTimer = 0;
  }
  draw();
  rafId = requestAnimationFrame(loop);
}

function endGame() {
  gameOver = true;
  cancelAnimationFrame(rafId);
  overlayTitle.textContent = 'Game Over';
  overlayText.textContent = `Score: ${score} · Lines: ${lines}`;
  overlay.classList.add('show');
}

function startGame() {
  grid = emptyGrid();
  score = 0; lines = 0; level = 1;
  dropInterval = 800; dropTimer = 0; lastTime = 0;
  gameOver = false; paused = false;
  nextPiece = makePiece(randomType());
  spawn();
  updateStats();
  overlay.classList.remove('show');
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

document.addEventListener('keydown', (e) => {
  if (gameOver) return;
  if (e.key === 'p' || e.key === 'P') {
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = 'Paused';
      overlayText.textContent = 'Press P to resume';
      overlay.classList.add('show');
    } else {
      overlay.classList.remove('show');
      lastTime = performance.now();
      rafId = requestAnimationFrame(loop);
    }
    return;
  }
  if (paused) return;

  switch (e.key) {
    case 'ArrowLeft': move(-1); break;
    case 'ArrowRight': move(1); break;
    case 'ArrowDown': softDrop(); dropTimer = 0; break;
    case 'ArrowUp': tryRotate(); break;
    case ' ': e.preventDefault(); hardDrop(); break;
    default: return;
  }
  draw();
});

document.getElementById('restart').addEventListener('click', startGame);

startGame();
</script>
</body>
</html>
